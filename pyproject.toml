[project]
name = "rnn-sequence-classification-platform"
version = "0.1.0"
description = ""
authors = [
    {name = "Hlib Khorunzhyi"}
]
requires-python = "~=3.12"
dependencies = [
    "hydra-core>=1.3.2,<1.4.0",
    "pydantic>=2.10.8,<3.0.0",
    "google-cloud-secret-manager>=2.23.0",
    "dvc[gdrive,gs]>=3.59.0",
    "pandas>=2.2.3",
    "nltk>=3.9.1",
    "symspellpy>=6.9.0,<7.0.0",
    "fsspec[gcs]>=2024.12.0",
    "gcsfs>=2024.12.0",
    "fastparquet>=2024.11.0",
    "distributed>=2024.12.1",
    "dask-cloudprovider[gcp]>=2024.8.0",
    "dask-ml>=2024.4.0",
    "bokeh>=3.6.2,<4.0.0",
    "cryptography<42.0.0",
    "pyOpenSSL>=24.0.0",
    "tokenizers>=0.23.3",
    "transformers>=5.22.1"
]

[tool.poetry.group.dev.dependencies]
jupyterlab = ">=3.6.3"
pytest = ">=7.3"
black = ">=23.3"
isort = ">5.12"
flake8 = ">=6.0"
mypy = ">=1.2"

types-pyYAML = "~=5.4.7"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py312"]
skip-string-normalization = false
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
known_first_party = ["src"]
default_section = "THIRDPARTY"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
force_grid_wrap = 0
combine_as_imports = true

[tool.mypy]
python_version = 3.12
ignore_missing_imports = true
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
